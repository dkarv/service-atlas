name: Benchmark

# Benchmarks the pushed branch alone and publishes its results on GitHub Pages, next to the latest results of the
# other branches. The benchmark and the scripts called here live on the branch benchmark, see its README.
on:
  push:
    branches: [main, "experiments/**"]
  workflow_dispatch:

permissions:
  contents: write # to push the results to the branch gh-pages

# A newer push to the same branch replaces a running benchmark.
concurrency:
  group: benchmark-${{ github.ref }}
  cancel-in-progress: true

jobs:
  benchmark:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      BRANCH: ${{ github.ref_name }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: benchmark

      # run.sh reads the implementation from the git repository: a local branch with the name of the pushed one.
      - name: Fetch the pushed commit
        run: git fetch --no-tags --depth=1 origin "+$GITHUB_SHA:refs/heads/$BRANCH"

      - name: Benchmark
        run: ./run.sh --json "$BRANCH" > result.json

      - name: Show the results
        if: always()
        run: |
          [ -s result.json ] || exit 0
          node bench/markdown.mjs result.json >> "$GITHUB_STEP_SUMMARY"

      # The branch gh-pages keeps the latest JSON of every branch and renders all of them into index.html.
      - name: Publish on GitHub Pages
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: bench/publish.sh "$BRANCH" result.json
