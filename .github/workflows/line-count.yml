name: Line count

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  line-count:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Update line counts in README and check the 150 line limit
        shell: python
        run: |
          import re, subprocess, sys

          desc = {
              "backend/src/main/kotlin/Services.kt": "crt.sh lookup, probing, cache",
              "backend/src/main/kotlin/Main.kt": "HTTP server, API, static files",
              "backend/src/main/kotlin/Http.kt": "HTTP client with timeouts and TLS trust",
              "backend/build.gradle.kts": "Gradle build definition",
              "backend/settings.gradle.kts": "Gradle project name",
              "frontend/main.js": "Loads, sorts and renders the services",
              "frontend/index.html": "Page skeleton and card template",
              "frontend/style.css": "Custom styles on top of Blades",
              "frontend/blades.min.css": "Vendored Blades CSS (Pico fork)",
              "Dockerfile": "Native image build, distroless container image",
          }
          categories = {"Backend": "backend/", "Frontend": "frontend/", "Dockerfile": "Dockerfile"}
          # Hidden files and folders like .github don't count.
          files = [f for f in subprocess.check_output(["git", "ls-files"], text=True).split() if not re.search(r"(^|/)\.", f)]
          lines = {f: open(f, "rb").read().count(b"\n") for f in files}
          # The table also skips Markdown docs.
          listed = sorted((f for f in files if not f.endswith(".md")), key=lines.get, reverse=True)

          unknown = [f for f in listed if f not in desc or not any(f.startswith(p) for p in categories.values())]
          for f in unknown:
              print(f"::error file={f}::Unknown file, add a description and category to .github/workflows/line-count.yml")
          if unknown:
              sys.exit(1)

          rows = ["| File | Lines | Description |", "| --- | ---: | --- |"]
          for name, prefix in categories.items():
              group = [f for f in listed if f.startswith(prefix)]
              rows += [f"| **{name}** | **{sum(lines[f] for f in group)}** | |"]
              rows += [f"| `{f}` | {lines[f]} | {desc[f]} |" for f in group]
          rows += [f"| **Total** | **{sum(lines[f] for f in listed)}** | |"]
          readme = open("README.md").read()
          readme = re.sub(r"(?s)(<!-- loc:start -->\n).*?(<!-- loc:end -->)", lambda m: m[1] + "\n".join(rows) + "\n" + m[2], readme)
          open("README.md", "w").write(readme)

          too_long = [f for f in files if lines[f] > 150]
          for f in too_long:
              print(f"::error file={f}::{lines[f]} lines, the limit is 150")
          sys.exit(1 if too_long else 0)

      - name: Commit README
        if: always()
        run: |
          git diff --quiet README.md && exit 0
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md
          git commit -m "Update line counts in README"
          git push
