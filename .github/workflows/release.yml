name: Docker & release

# Every push to main publishes the image as :latest and :main. The version lives in frontend/index.html
# (<span id="version">v1.2.3</span>); when it has no git tag yet, the image is also tagged :1.2.3 and :1.2 and a GitHub
# release v1.2.3 is created with auto-generated notes. This is one workflow because a tag pushed with GITHUB_TOKEN
# would not trigger another one.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write # to create the tag and the release
  packages: write

# Two quick pushes must not both try to create the same release.
concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - id: version
        name: Read the version and check whether it is released
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version=$(grep -oP 'id="version">v\K[0-9]+\.[0-9]+\.[0-9]+(?=<)' frontend/index.html)
          [ -n "$version" ] || { echo "::error file=frontend/index.html::No version like v1.2.3 in #version"; exit 1; }
          echo "version=$version" >> "$GITHUB_OUTPUT"
          # Only main releases, a manual run on another branch just publishes that branch's image.
          if [ "$GITHUB_REF" != refs/heads/main ] || gh release view "v$version" > /dev/null 2>&1; then
            echo "new=false" >> "$GITHUB_OUTPUT"
          else
            echo "new=true" >> "$GITHUB_OUTPUT"
            echo "New version v$version" >> "$GITHUB_STEP_SUMMARY"
          fi

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Besides the tags, this sets the OCI labels title, description, url, source, revision, created and licenses.
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=ref,event=branch
            type=semver,pattern={{version}},value=v${{ steps.version.outputs.version }},enable=${{ steps.version.outputs.new }}
            type=semver,pattern={{major}}.{{minor}},value=v${{ steps.version.outputs.version }},enable=${{ steps.version.outputs.new }}
          labels: |
            org.opencontainers.image.version=${{ steps.version.outputs.version }}
            org.opencontainers.image.documentation=${{ github.server_url }}/${{ github.repository }}#readme
            org.opencontainers.image.licenses=MIT

      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          annotations: ${{ steps.meta.outputs.annotations }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Create the release
        if: steps.version.outputs.new == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: v${{ steps.version.outputs.version }}
        run: gh release create "$VERSION" --target "$GITHUB_SHA" --title "$VERSION" --generate-notes
