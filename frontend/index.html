<!doctype html>
<html lang="en">

<head>
  <meta charset="utf-8">
  <title>Services</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link href="/blades.min.css" rel="stylesheet">
  <link href="/style.css" rel="stylesheet">
</head>

<body>
  <main class="container">
    <header class="stack">
      <h1 id="title">Services</h1>
      <small><span id="meta">Loading services...</span> <a id="refresh" title="Refresh (skips the cache)" hidden>🔃</a></small>
    </header>

    <section class="grid services" aria-label="Self-hosted projects">
      <article id="service-template" class="card stack">
        <h5>
          <span><img data-service-icon alt="" hidden> <span data-service-name>Loading services...</span></span>
          <a data-service-link title="Open" target="_blank" rel="noopener" hidden>↗️</a>
        </h5>
        <p data-service-description>Fetching discovered hostnames.</p>
        <small data-service-status></small>
      </article>
    </section>
  </main>
  <script src="/main.js"></script>
</body>

</html>
